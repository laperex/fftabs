<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7139"/>
      <stop offset="100%" stop-color="#9059ff"/>
    </linearGradient>
    <linearGradient id="tab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0e0e0" stop-opacity="0.90"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#bg)"/>
  <!-- Back tab -->
  <rect x="22" y="18" width="44" height="28" rx="4" fill="#ffffff" fill-opacity="0.4"/>
  <!-- Middle tab -->
  <rect x="27" y="28" width="48" height="34" rx="5" fill="#ffffff" fill-opacity="0.7"/>
  <!-- Front active tab -->
  <rect x="32" y="38" width="50" height="40" rx="6" fill="url(#tab)"/>
  <!-- Tab header dots / line -->
  <rect x="38" y="46" width="22" height="4" rx="2" fill="#ff7139"/>
  <rect x="38" y="56" width="38" height="3" rx="1.5" fill="#737373"/>
  <rect x="38" y="64" width="26" height="3" rx="1.5" fill="#a0a0a0"/>
</svg>
