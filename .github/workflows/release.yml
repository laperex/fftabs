name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.4)"
        required: false
        default: ""

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install Pillow

      - name: Run tests
        run: |
          python3 -m unittest discover tests/ -v
          node -c extension/background.js
          python3 -m py_compile fftabs

      - name: Determine version tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          mkdir -p release_assets

      - name: Package extension (zip)
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          (cd extension && zip -r "../release_assets/fftabs-extension-v${VERSION}.zip" ./*)

      - name: Package host bundle (tar.gz)
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          BUNDLE="fftabs-v${VERSION}"
          mkdir -p "${BUNDLE}"
          cp -r fftabs README.md LICENSE extension "${BUNDLE}/"
          tar -czvf "release_assets/${BUNDLE}.tar.gz" "${BUNDLE}"
          rm -rf "${BUNDLE}"

      - name: Sign extension with web-ext (optional)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          echo "Signing extension with AMO credentials..."
          npx web-ext sign \
            --source-dir extension \
            --channel=unlisted \
            --api-key="${AMO_JWT_ISSUER}" \
            --api-secret="${AMO_JWT_SECRET}" \
            --artifacts-dir=release_assets
          XPI=$(find release_assets -name "*.xpi" | head -n 1)
          if [ -n "$XPI" ]; then
            cp "$XPI" "release_assets/fftabs-v${VERSION}.xpi"
          fi

      - name: Generate Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: fftabs ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: release_assets/*
